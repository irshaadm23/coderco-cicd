name: Assignment 1 CI/CD

on:
  # Run validation when a pull request targets main
  pull_request:
    branches:
      - main

  # Run the release workflow when code reaches main
  push:
    branches:
      - main

env:
  # Docker image name
  IMAGE_NAME: service-status-api

  # Azure Container Registry name
  ACR_NAME: irshaadcicd

  # Full Azure Container Registry login server
  ACR_LOGIN_SERVER: irshaadcicd.azurecr.io


jobs:

  # Check code quality with Ruff
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r assignment1/requirements.txt

      - name: Run Ruff linting
        working-directory: assignment1
        run: python -m ruff check app tests


  # Run automated tests
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r assignment1/requirements.txt

      - name: Run unit tests
        working-directory: assignment1
        run: python -m pytest tests/ -v


  # Validate that the Docker image can build on pull requests
  docker-build:
    needs:
      - lint
      - test

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker image build
        uses: ./.github/actions/docker-build
        with:
          image-name: ${{ env.IMAGE_NAME }}
          context: assignment1


  # Build and publish the release image after code reaches main
  publish-image:
    needs:
      - lint
      - test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      # Allow the workflow to read repository files
      contents: read

      # Allow GitHub to request an OIDC token for Azure authentication
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate GitHub Actions to Azure using OIDC
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Authenticate Docker to Azure Container Registry
      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      # Build, tag and push the Docker image using the custom action
      - name: Publish Docker image
        uses: ./.github/actions/docker-publish
        with:
          image-name: ${{ env.IMAGE_NAME }}
          context: assignment1
          registry: ${{ env.ACR_LOGIN_SERVER }}
          image-tag: ${{ github.sha }}