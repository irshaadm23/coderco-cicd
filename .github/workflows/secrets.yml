name: secrets-demo
on: [push]

jobs:
    test:
    runs-on: ubtuntu-latest

    steps:  
        -name: checkout code
        uses: actions/checkout/v4

        -name: use secrets
        run: echo "this is my secret ${{secrets.MY_SECRETS}}"

        -name: USE secrets from env varaible
        run: echo "this is my $MY_SECRETS"
        env:
            MY_SECRETS: ${{secret.MY_SECRETS}}